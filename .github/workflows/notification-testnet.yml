---
name: Testnet Notification
on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      bat_network:
        type: string
        required: true
      bat_availability_test_status:
        type: string
        required: true
      bat_produce_blocks:
        type: string
        required: true
      bat_fund_status:
        type: string
        required: true
      bat_check_deployed_smart_contract_status:
        type: string
        required: true
      bat_method_set_status:
        type: string
        required: true
      bat_method_get_status:
        type: string
        required: true
      pp_network:
        type: string
        required: true
      pp_availability_test_status:
        type: string
        required: true
      pp_produce_blocks:
        type: string
        required: true
      pp_fund_status:
        type: string
        required: true
      pp_check_deployed_smart_contract_status:
        type: string
        required: true
      pp_method_set_status:
        type: string
        required: true
      pp_method_get_status:
        type: string
        required: true
      sanity_check_tests_output:
        description: Sanity Check Tests output
        type: string
        required: true
      stake_test_output:
        description: Stake Test output
        type: string
        required: true
      unstake_test_output:
        description: Unstake Test output
        type: string
        required: true
      register_validator_test_output:
        description: Register Validator Test output
        type: string
        required: true
      withdraw_rewards_test_output:
        description: Withdraw Rewards Test output
        type: string
        required: true
      unstake_all_test_output:
        description: Unstake All Test output
        type: string
        required: true
      results_artifact_id:
        type: string
        required: true
    secrets:
      AWS_S3_BLADE_BUCKET:
        required: true
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notification:
    name: Notification
    runs-on: ubuntu-latest
    steps:
      - name: Short SHA
        id: short_sha
        run: echo "value=`echo ${{ github.sha }} | cut -c1-7`" >> $GITHUB_OUTPUT
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.25.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
          succeed_bnt: "primary"
          failed_bnt: "danger"
          succeed_job: ":green:"
          failed_job: ":red:"
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Nightly Testnet"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Workflow Run"
                      },
                      "style": "${{ inputs.bat_produce_blocks == 'true' && inputs.bat_fund_status == 'true' && inputs.bat_check_deployed_smart_contract_status == 'true' && inputs.bat_method_set_status == 'true' && inputs.bat_method_get_status == 'true' && inputs.pp_produce_blocks == 'true' && inputs.pp_fund_status == 'true' && inputs.pp_check_deployed_smart_contract_status == 'true' && inputs.pp_method_set_status == 'true' && inputs.pp_method_get_status == 'true' && inputs.sanity_check_tests_output == 'true' && env.succeed_bnt || env.failed_bnt }}",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Sanity Check Results"
                      },
                      "style": "${{ inputs.sanity_check_tests_output == 'true' && env.succeed_bnt || env.failed_bnt }}",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ inputs.results_artifact_id }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Network: *${{ inputs.bat_network }}*"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.bat_produce_blocks == 'true' && env.succeed_job || env.failed_job }} *Produce Blocks*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.bat_fund_status == 'true' && env.succeed_job || env.failed_job }} *Fund Account*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.bat_check_deployed_smart_contract_status == 'true' && env.succeed_job || env.failed_job }} *Deploy Smart Contract*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.bat_method_set_status == 'true' && env.succeed_job || env.failed_job }} *Method set()*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.bat_method_get_status == 'true' && env.succeed_job || env.failed_job }} *Method get()*"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.stake_test_output == 'PASSED' && env.succeed_job || env.failed_job }} *Stake Test*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.unstake_test_output == 'PASSED' && env.succeed_job || env.failed_job }} *Unstake Test*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.register_validator_test_output == 'PASSED' && env.succeed_job || env.failed_job }} *Register Validator Test*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.withdraw_rewards_test_output == 'PASSED' && env.succeed_job || env.failed_job }} *Withdraw Rewards Test*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.unstake_all_test_output == 'PASSED' && env.succeed_job || env.failed_job }} *Unstake All Test*"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Network: *${{ inputs.pp_network }}*"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.pp_produce_blocks == 'true' && env.succeed_job || env.failed_job }} *Produce Blocks*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.pp_fund_status == 'true' && env.succeed_job || env.failed_job }} *Fund Account*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.pp_check_deployed_smart_contract_status == 'true' && env.succeed_job || env.failed_job }} *Deploy Smart Contract*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.pp_method_set_status == 'true' && env.succeed_job || env.failed_job }} *Method set()*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.pp_method_get_status == 'true' && env.succeed_job || env.failed_job }} *Method get()*"
                    }
                  ]
                }
              ]
            }
