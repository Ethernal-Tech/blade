---
    name: Governance Tests
    on: # yamllint disable-line rule:truthy
      workflow_dispatch:
        inputs:
          environment:
            description: The environment to run against
            type: choice
            options: [dev, test] # nightly should not be initiated manually
      workflow_call:
        inputs:
          environment:
            description: The environment to run against
            type: string
            required: true
        outputs:
          governance_tests_output:
            description: Governance Tests output
            value: ${{ jobs.governance_tests.outputs.test_output_success }}
          block_time_test_output:
            description: Block Time Test output
            value: ${{ jobs.governance_tests.outputs.block_time_test }}
          epoch_size_test_output:
            description: Epoch Size Test output
            value: ${{ jobs.governance_tests.outputs.epoch_size_test }}
          base_fee_denom_test_output:
            description: Base Fee Denom Test output
            value: ${{ jobs.governance_tests.outputs.base_fee_denom }}
        secrets:
          AWS_ROLE_ARN:
            required: true
          AWS_S3_BLADE_BUCKET:
            required: true
          AWS_LOADTESTRUNNER_MNEMONIC:
            required: true
    
    permissions:
      id-token: write
      contents: read
      security-events: write
    
    jobs:
      check_network:
        name: Check if the network is already deployed
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        outputs:
          rpc_url: ${{ steps.rpc_url.outputs.url }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v4.1.1
          - name: Configure AWS Credentials
            uses: aws-actions/configure-aws-credentials@v4.0.1
            with:
              aws-region: ${{ vars.AWS_REGION }}
              role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          - name: Retrieve state file from s3
            id: retrieve_state
            run: echo "retrieve_state_output=$(aws s3 cp s3://${{ secrets.AWS_S3_BLADE_BUCKET }}/${{ vars.TF_STATE_PATH }} state.json)" >> $GITHUB_OUTPUT
          - name: Set RPC URL
            id: rpc_url
            if: contains(steps.retrieve_state.outputs.retrieve_state_output, 'download')
            run: echo "url=$(cat state.json | jq -r '.outputs.aws_lb_ext_domain.value // empty')" >> $GITHUB_OUTPUT
      governance_tests:
        name: Run Governance Tests
        runs-on: ubuntu-latest
        needs: check_network
        environment: ${{ inputs.environment }}
        if: needs.check_network.outputs.rpc_url != ''
        outputs:
          test_output_success: ${{ steps.governance_tests_results.outputs.test_output }}
          block_time_test: ${{ steps.governance_tests_results.outputs.block_time_test }}
          epoch_size_test: ${{ steps.governance_tests_results.outputs.epoch_size_test }}
          base_fee_denom: ${{ steps.governance_tests_results.outputs.base_fee_denom }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v4.1.1
          - name: Install Go
            uses: actions/setup-go@v5.5.0
            with:
              go-version: ${{ vars.GOLANG_VERSION }}
          - name: Build Blade
            run: make build
          - name: Configure AWS Credentials
            uses: aws-actions/configure-aws-credentials@v4.0.1
            with:
              aws-region: ${{ vars.AWS_REGION }}
              role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          - name: Get validator keys
            run: aws ssm get-parameters --names `aws ec2 describe-instances --filters "Name=tag:BaseDN,Values=${{ inputs.environment }}${{ vars.BASEDN_SUFIX }}" "Name=tag:Role,Values=validator" "Name=instance-state-name,Values=running" --query "Reservations[*].Instances[*].Tags[?Key=='Name'].Value[]" --region ${{ vars.AWS_REGION }} --output text | sed 's/.*/\/${{ inputs.environment }}\/&\/validator-key/'` --with-decryption --region ${{ vars.AWS_REGION }} > keys.json
          - name: Start Governance Test
            id: governance_tests_results
            run: |
              ./blade governance --jsonrpc "http://${{ needs.check_network.outputs.rpc_url }}" --mnemonic "${{ secrets.AWS_LOADTESTRUNNER_MNEMONIC }}" --receipts-timeout 2m --validator-keys "`cat keys.json | jq -r '.Parameters[].Value' | tr '\n' ',' | sed 's/,$//'`" --to-json
              echo "test_output=`cat governance_test_results.json | jq 'map(select(.Result != "PASSED")) | length == 0'`" >> $GITHUB_OUTPUT
              echo "block_time_test=`cat governance_test_results.json | jq -r '.[] | select(.Name == "Block Time Test") | .Result'`" >> $GITHUB_OUTPUT
              echo "epoch_size_test=`cat governance_test_results.json | jq -r '.[] | select(.Name == "Epoch Size test") | .Result'`" >> $GITHUB_OUTPUT
              echo "base_fee_denom=`cat governance_test_results.json | jq -r '.[] | select(.Name == "Base Fee Denom test") | .Result'`" >> $GITHUB_OUTPUT
          - name: Archive Sanity Check Test results
            if: always()
            uses: actions/upload-artifact@v4.3.0
            id: artifact-upload
            with:
              name: governance-tests
              path: governance_test_results.json
              retention-days: 30
    