      results_artifact_id: ${{ needs.load_test_mixed.outputs.results_artifact_id }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  notification_load_test_erc1155:
    name: Load Test ERC1155 Notification
    uses: ./.github/workflows/notification-load-test.yml
    needs: [load_test_erc1155, testnet_notification, notification_load_test_perf, notification_load_test_eoa, notification_load_test_erc20, notification_load_test_erc721, notification_load_test_mixed]
    if: (always() && needs.load_test_erc1155.outputs.load_test_output == 'true')
    with:
      environment: testnet
      type: ERC1155
      dynamic: true
      vus: "100"
      txs_per_user: "1000"
      txpool_timeout: "50m0s"
      wait_txpool: true
      receipts_timeout: "2m0s"
      batch_size: "1000"
      total_time: ${{ needs.load_test_erc1155.outputs.total_time }}
      total_txs: ${{ needs.load_test_erc1155.outputs.total_txs }}
      total_blocks: ${{ needs.load_test_erc1155.outputs.total_blocks }}
      avg_txs_per_second: ${{ needs.load_test_erc1155.outputs.avg_txs_per_second }}
      max_txs_per_second: ${{ needs.load_test_erc1155.outputs.max_txs_per_second }}
      total_gas_used: ${{ needs.load_test_erc1155.outputs.total_gas_used }}
      avg_gas_per_tx: ${{ needs.load_test_erc1155.outputs.avg_gas_per_tx }}
      avg_gas_utilization: ${{ needs.load_test_erc1155.outputs.avg_gas_utilization }}
      max_gas_utilization: ${{ needs.load_test_erc1155.outputs.max_gas_utilization }}
      txpool_pending: ${{ needs.load_test_erc1155.outputs.txpool_pending }}
      txpool_queued: ${{ needs.load_test_erc1155.outputs.txpool_queued }}
      results_artifact_id: ${{ needs.load_test_erc1155.outputs.results_artifact_id }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
